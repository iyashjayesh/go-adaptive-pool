name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    # The recorder adapters are separate modules, so ./... stops at them
    - name: Download dependencies
      run: |
        for d in . promrecorder otelrecorder examples/observability; do
          (cd $d && go mod download)
        done

    - name: Run tests
      run: |
        for d in . promrecorder otelrecorder; do
          (cd $d && go test -race -v -coverprofile=coverage.out ./...)
        done

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out,./promrecorder/coverage.out,./otelrecorder/coverage.out
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m
        only-new-issues: true

    - name: Run golangci-lint (promrecorder)
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m
        only-new-issues: true
        working-directory: promrecorder

    - name: Run golangci-lint (otelrecorder)
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m
        only-new-issues: true
        working-directory: otelrecorder

    - name: Run golangci-lint (examples/observability)
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m
        only-new-issues: true
        working-directory: examples/observability

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Run benchmarks
      run: |
        for d in . promrecorder otelrecorder; do
          (cd $d && go test -bench=. -benchmem -benchtime=5s ./...)
        done | tee benchmark.txt

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark.txt
